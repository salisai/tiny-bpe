[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "bpe-tokenizer"
version = "0.1.0"
description = "Byte-level BPE tokenizer with a native C++ encoding core"
requires-python = ">=3.9"
dependencies = ["regex"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["bpe_tokenizer"]

[tool.scikit-build.cmake.define]
CMAKE_CXX_STANDARD = "17"
